<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width initial-scale=1"
  />

  <title>Collecting Data</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@100..900&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="https://use.typekit.net/hju4rzt.css">


  <link
    rel="stylesheet"
    href="style.css"
  />


</head>

<body>

  <main>
  <h2><span id="countBadge" class="count-badge">0</span> Times I Hit Apply</h2>
    
    <!-- Filters -->
    <form id="filterForm" class="filter-form">
      <input type="text" name="jobTitle" id="filterJobTitle" placeholder="Job title" />
      <input type="text" name="company" id="filterCompany" placeholder="Company" />
      <input type="text" name="connectionToCompany" id="filterConnection" placeholder="Connection to company" />
      <select name="status" id="filterStatus">
        <option value="">Any status</option>
        <option value="No Answer">No Answer</option>
        <option value="Rejected">Rejected</option>
        <option value="Accepted">Accepted</option>
      </select>
      <select name="year" id="filterYear">
        <option value="">Any year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
        <option value="5">5th Year</option>
      </select>
      
      <fieldset class="filter-fieldset">
        <legend>Application Process</legend>
        <div class="filter-process-group">
          <label><input type="checkbox" class="filter-process" value="email" /> Email</label>
          <label><input type="checkbox" class="filter-process" value="one-sided" /> One-sided</label>
          <label><input type="checkbox" class="filter-process" value="behavioural" /> Behavioural</label>
          <label><input type="checkbox" class="filter-process" value="portfolio" /> Portfolio</label>
          <label><input type="checkbox" class="filter-process" value="design" /> Design / Take-home</label>
          <label><input type="checkbox" class="filter-process" value="recruiter" /> Recruiter</label>
        </div>
      </fieldset>
      
      <label><input type="checkbox" name="design" id="filterDesign" /> Design related</label>
      <label><input type="checkbox" name="referred" id="filterReferred" /> Referred</label>
      <label><input type="checkbox" name="tailored" id="filterTailored" /> Tailored App</label>
      <label><input type="checkbox" class="filter-process" id="filterPrivate" value="private" /> Private Posting</label>
      
      <button type="submit">Apply filters</button>
      <button type="button" id="clearFilters">Clear</button>
    </form>

    <button id="openFormBtn" class="open-btn">Add Job App</button>

    <!-- Modal container -->
    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-overlay" data-close></div>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" data-close aria-label="Close form">×</button>
        <h3 id="modalTitle">Add a Job Application</h3>
        <form id="myForm">
      <fieldset>
        <label for="jobTitle">Job Title</label>
        <input
          required
          type="text"
          name="Job_Title"
          id="jobTitle"
          placeholder="e.g. Product Design Intern"
          autocomplete="off"
        />
        <small class="validation">Job Title is required</small>
      </fieldset>

      <fieldset>
        <label for="company">Company</label>
        <input
          required
          type="text"
          name="Company"
          id="company"
          placeholder="e.g. Acme Corp"
          autocomplete="off"
        />
        <small class="validation">Company is required</small>
      </fieldset>

      <fieldset>
        <label for="company">Applied Using</label>
        <input
          required
          type="text"
          name="Applied_On"
          id="appliedOn"
          placeholder="e.g. LinkedIn"
          autocomplete="off"
        />
        <small class="validation">Applied using is required</small>
      </fieldset>

      <fieldset>
        <label for="company">Connection to Company</label>
        <input
          required
          type="text"
          name="Connection_To_Company"
          id="connectionToCompany"
          placeholder="e.g. Employee Referral"
          autocomplete="off"
        />
        <!-- <small class="validation">Connection to Company is required</small> -->
      </fieldset>

      <fieldset>
        <legend>Design Related</legend>
        <label for="Design_Related_">
          <input
            type="checkbox"
            name="isRelated"
            id="isRelated"
          />
          <span>Design-Related</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Referred</legend>
        <label for="Referred">
          <input
            type="checkbox"
            name="isReferred"
            id="isReferred"
          />
          <span>Referred</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Tailored Application</legend>
        <label for="Tailored Application">
          <input
            type="checkbox"
            name="isTailored"
            id="isTailored"
          />
          <span>Tailored Application</span>
        </label>
      </fieldset>

      <fieldset>
        <legend>Year</legend>
        <small>Year</small>
        <label for="1st Year">
          <input
            type="radio"
            id="1st Year"
            name="year"
            value="1st Year"
          />
          <span>1st Year</span>
        </label>
        <label for="2nd Year">
          <input
            type="radio"
            id="2nd Year"
            name="year"
            value="2nd Year"
          />
          <span>2nd Year</span>
        </label>
        <label for="3rd Year">
          <input
            type="radio"
            id="3rd Year"
            name="year"
            value="3rd Year"
          />
          <span>3rd Year</span>
        </label>
        <label for="4th Year">
          <input
            type="radio"
            id="4th Year"
            name="year"
            value="4th Year"
          />
          <span>4th Year</span>
        </label>
        <label for="5th Year">
          <input
            type="radio"
            id="5th Year"
            name="year"
            value="5th Year"
          />
          <span>5th Year</span>
        </label>
      </fieldset>
      
      <fieldset>
        <legend>Status</legend>
        <select name="Status" id="status">
          <option value="">Select status</option>
          <option value="No Answer">No Answer</option>
          <option value="Rejected">Rejected</option>
          <option value="Accepted">Accepted</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Process</legend>
        <small>Process</small>
        <label>
          <input
            type="checkbox"
            id="Email_Questions"
            name="Email_Questions"
          />
          <span>Email Questions</span>
        </label>
        <label>
          <input
            type="checkbox"
            id="One_Sided_Interview"
            name="One_Sided_Interview"
          />
          <span>One-Sided Interview</span>
        </label>
        <label>
          <input
            type="checkbox"
            id="Behaviourial_Interview"
            name="Behaviourial_Interview"
          />
          <span>Behavioural Interview</span>
        </label>
        <label>
          <input
            type="checkbox"
            id="Portfolio_Walkthrough"
            name="Portfolio_Walkthrough"
          />
          <span>Portfolio Walkthrough</span>
        </label>
        <label>
          <input
            type="checkbox"
            id="Take_home_Challenge"
            name="Take_home_Challenge"
          />
          <span>Design / Take-home Challenge</span>
        </label>
        <label>
          <input
            type="checkbox"
            id="Recruiter_Call"
            name="Recruiter_Call"
          />
          <span>Recruiter Call</span>
        </label>
      </fieldset>
      
      <fieldset>
        <button class="save">Save</button>
        <button class="reset" type="reset">Reset</button>
      </fieldset>
        </form>
      </div>
    </div>

    <!-- Grid and detail layout -->
    <div class="grid-layout">
      <!-- Grid view container -->
      <section id="gridContainer" class="grid-container">
      </section>

      <!-- Detail panel on the right -->
      <aside id="detailPanel" class="detail-panel">
        <h3 id="detailTitle">Hover over a square</h3>
        <div id="detailContent"></div>
      </aside>
    </div>
  </main>

  <!-- <footer>
    Created by <a href="https://nsitu.ca">Harold Sikkema</a> in the context of
    Systems Design in the Interaction Design program at Sheridan College.
  </footer> -->

  <script
    src="script.js"
    type="module"
  ></script>

</body>

</html>
